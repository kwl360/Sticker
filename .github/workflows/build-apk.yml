name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install required Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate animated WebP test stickers
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('app/src/main/assets/stickers');p.mkdir(parents=True,exist_ok=True)
          for n in range(1,4):
              frames=[]
              for t in range(12):
                  im=Image.new('RGBA',(512,512),(0,0,0,0))
                  d=ImageDraw.Draw(im)
                  d.rounded_rectangle((35,35,477,477),radius=80,fill=(15,102,106,255))
                  d.ellipse((100+t*9,175,230+t*9,305),fill=(250,211,80,255))
                  d.text((145,380),f'KWL360 {n}',fill='white')
                  frames.append(im)
              frames[0].save(p/f'sticker-{n}.webp',save_all=True,append_images=frames[1:],duration=110,loop=0,format='WEBP',quality=65)
          tray=Image.new('RGBA',(96,96),(15,102,106,255))
          ImageDraw.Draw(tray).ellipse((20,20,76,76),fill=(250,211,80,255))
          tray.save(p/'tray.png')
          PY
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KWL360-WATS-build-log
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KWL360-WATS-APK
          path: app/build/outputs/apk/debug/*.apk
